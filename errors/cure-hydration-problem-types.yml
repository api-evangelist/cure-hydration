generated: '2026-08-11'
method: probed
source: 'live error probes against https://www.curehydration.com/api/ucp/mcp and /api/2026-04/graphql.json'
format: json-rpc-2.0
rfc9457: false
summary: >-
  Cure Hydration publishes no error reference. The catalogue below is what the live surfaces
  actually returned to deliberate malformed requests on 2026-08-11. The MCP endpoint answers
  in JSON-RPC 2.0 error shape with a vendor error code in `data.code`; the GraphQL endpoint
  answers in the GraphQL `errors[]` envelope. Neither is RFC 9457 problem+json.

envelopes:
  - surface: 'MCP — POST /api/ucp/mcp'
    shape: '{"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":<string>,"data":{"code":<slug>,"content":<string>,"continue_url":<url>}}}'
    machine_readable_key: error.data.code
    human_key: error.data.content
    recovery_key: error.data.continue_url
    note: >-
      `continue_url` is a genuinely useful field — the server hands back a human-completable
      URL so an agent that cannot proceed can escalate to the buyer rather than dead-end.
  - surface: 'GraphQL — POST /api/{version}/graphql.json'
    shape: '{"errors":[{"message":<string>}]}'
    machine_readable_key: null
    note: Message-only. No extensions.code was returned on the malformed-request probe.

problem_types:
  - id: invalid_profile_url
    surface: mcp
    jsonrpc_code: -32001
    http_status: 200
    title: UCP discovery failed
    detail: 'Unable to fetch agent profile: Missing profile uri'
    cause: The request omitted meta["ucp-agent"].profile.
    remediation: >-
      Publish an agent profile document at a stable HTTPS URL and pass its URI in
      meta["ucp-agent"].profile on every tools/call and resources/list request.
    observed: '2026-08-11'
    observed_on:
      - 'method: tools/call'
      - 'method: resources/list'

  - id: profile_unreachable
    surface: mcp
    jsonrpc_code: -32001
    http_status: 422
    title: UCP discovery failed
    detail: 'Unable to fetch agent profile: Http error'
    cause: The supplied agent profile URI was present but the server could not fetch it.
    remediation: Serve the agent profile over HTTPS at a publicly resolvable URL that returns 200.
    observed: '2026-08-11'

  - id: rate_limited
    surface: mcp
    http_status: 429
    title: Rate limited
    detail: The MCP endpoint is rate-limited per IP.
    cause: Too many requests from one source IP.
    remediation: Back off on 429 responses.
    observed: false
    source: 'documented in https://www.curehydration.com/llms.txt (not reproduced in probe)'

  - id: graphql_no_query_string
    surface: graphql
    http_status: 200
    title: No query string was present
    cause: The GraphQL endpoint was called without a `query` field in the body.
    remediation: POST a JSON body containing a `query` string.
    observed: '2026-08-11'

  - id: storefront_not_found
    surface: storefront
    http_status: 404
    title: Page not found
    content_type: text/html
    cause: An unknown storefront path.
    remediation: >-
      Note for machine clients — the 404 is an HTML page, not JSON, on every path including
      /.well-known/*. Do not parse a 404 body as data.
    observed: '2026-08-11'

gaps:
  - No published error reference, error-code registry, or status-code table for any surface.
  - No RFC 9457 application/problem+json anywhere.
  - >-
    The MCP error `code` values observed are UCP/Shopify platform codes; Cure documents none
    of them, so an integrator discovers them only by hitting them.
