notes:
  - >-
    This is a platform-provided surface. Cure Hydration did not build the UCP server; Shopify
    serves it natively for the store. It is nonetheless served from Cure's own apex domain,
    advertised by Cure's own robots.txt, llms.txt and agents.md, and it is the real, live,
    machine-readable contract for transacting with this merchant.
  - >-
    The tool input schemas in mcp/cure-hydration-tools-list.json are the live, authoritative
    parameter contract — this provider publishes no OpenAPI, so those schemas are the closest
    thing to one.
