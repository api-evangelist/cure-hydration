apis:
- name: CURE Universal Commerce Protocol (UCP) MCP Server
  description: >-
    A live, first-party, anonymously discoverable Model Context Protocol server implementing
    the Shopify Universal Commerce Protocol shopping service for the CURE storefront. Thirteen
    tools cover catalog search and lookup, product detail, cart create/read/update/cancel, and
    checkout create/read/update/complete/cancel plus order read. tools/list and initialize
    answer without credentials; tool invocation requires a resolvable UCP agent profile URI,
    and complete_checkout additionally requires an idempotency key.
  humanURL: https://www.curehydration.com/agents.md
  baseURL: https://www.curehydration.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - UCP
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/cure-hydration-mcp.yml
  - type: ToolCrosswalk
    url: mcp/cure-hydration-tool-crosswalk.yml
  - type: Documentation
    url: https://www.curehydration.com/agents.md
  - type: LLMsTxt
    url: llms/cure-hydration-llms.txt
- name: CURE Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API served on Cure Hydration's own apex domain, pinned to
    API version 2026-04. Full introspection answered anonymously on 2026-08-11 — 416 types, 35
    root queries and 41 mutations covering products, collections, carts, customer accounts,
    blog content and Shop Pay payment request sessions.
  humanURL: https://www.curehydration.com/agents.md
  baseURL: https://www.curehydration.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Ecommerce
  properties:
  - type: GraphQL
    url: graphql/cure-hydration-storefront.graphql
  - type: APIReference
    url: graphql/cure-hydration-graphql.yml
  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
- name: CURE Storefront JSON Endpoints
  description: >-
    Read-only, unauthenticated JSON endpoints the store documents for agents in /agents.md —
    product list, product detail by handle, collection list, collection products, store
    metadata and search. Unversioned, page-and-limit paginated, ETag-validated.
  humanURL: https://www.curehydration.com/agents.md
  baseURL: https://www.curehydration.com
  tags:
  - REST
  - Catalog
  - Ecommerce
  properties:
  - type: Examples
    url: examples/_index.yml
  - type: Documentation
    url: https://www.curehydration.com/agents.md
