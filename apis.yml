name: Cure Hydration
description: >-
  Cure Hydration (CURE) is a New York based direct-to-consumer beverage brand founded in 2019
  by Lauren Picasso, selling plant-based electrolyte drink mixes built on the World Health
  Organization's Oral Rehydration Solution formula — organic coconut water, pink Himalayan
  salt, no added sugar. It is not a software company and it runs no developer programme, but
  its Shopify storefront serves a substantive first-party machine surface: a live Universal
  Commerce Protocol (UCP 2026-04-08) MCP server at /api/ucp/mcp with 13 catalog, cart,
  checkout and order tools, an anonymously introspectable Storefront GraphQL API, agent
  instructions at /agents.md and /llms.txt, a dedicated agent-discovery sitemap, and OpenID
  Connect discovery for shopper accounts. This profile records that surface as probed.
