summary: >-
  Cure Hydration makes no first-party standards claim. Everything asserted below was read
  off a live response. The conformance profile is that of a Shopify-hosted merchant that has
  the current agentic-commerce stack switched on: UCP 2026-04-08 over MCP, OIDC + RFC 8414
  discovery, llms.txt and agents.md, and an agent-discovery sitemap.

standards:
  - id: ucp
    name: Universal Commerce Protocol 2026-04-08
    conforms: true
    evidence:
      url: https://www.curehydration.com/.well-known/ucp
      http_status: 200
      detail: >-
        Declares ucp.version 2026-04-08 with 2026-01-23 also supported, the dev.ucp.shopping
        service over mcp and embedded transports, eight capabilities (checkout, fulfillment,
        discount, cart, order, catalog.search, catalog.lookup, dev.shopify.catalog) and three
        payment handlers.
    spec: https://ucp.dev/2026-04-08/specification/overview/

  - id: mcp
    name: Model Context Protocol
    conforms: true
    version: '2024-11-05'
    evidence:
