compliance_certifications: []
compliance_note: >-
  No trust center, no SOC 2 / ISO 27001 / PCI / HIPAA claim, and no compliance page is
  published on curehydration.com. Payment card handling is delegated entirely to Shopify and
  its payment handlers (Shop Pay, Google Pay, Shopify card), so the store makes no PCI claim
  of its own. Consumer privacy surfaces do exist — a CCPA request form at
  /pages/california-consumer-privacy-act-ccpa-form and a data-sharing opt-out at
  /pages/data-sharing-opt-out — but those are rights-request forms, not a certification.
